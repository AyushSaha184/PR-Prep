version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pr_prep_postgres
    environment:
      POSTGRES_DB: pr_prep_dev
      POSTGRES_USER: pr_prep
      POSTGRES_PASSWORD: pr_prep_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pr_prep -d pr_prep_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pr_prep_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
